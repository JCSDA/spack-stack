name: nautilus heinzell auto ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BASEDIR: /p/work2/heinzell/spack-stack-nightly
  PLATFORM: nautilus
  COMPILER: oneapi

jobs:

  nightly-build-oneapi:
    runs-on: ['self-hosted','nautilus-heinzell']
    # Set timeout to 12hrs
    #timeout-minutes: 720
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        clean: true
    - name: 01_DirectorySetup
      uses: ./.github/actions/Nightly_01_DirectorySetup
    - name: 02_GetSpackStackDevelop
      uses: ./.github/actions/Nightly_02_GetSpackStackDevelop
    - name: 03_SetupUnifiedEnv
      uses: ./.github/actions/Nightly_03_SetupUnifiedEnv
    - name: 04_SpackInstall
      uses: ./.github/actions/Nightly_04_SpackInstall
