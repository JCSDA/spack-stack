packages:
  all:
    compiler:: [gcc@10.2.0]
    providers:
      mpi:: [intel-oneapi-mpi@2021.3.0]
  mpi:
    buildable: False
  intel-oneapi-mpi:
    externals:
    - spec: intel-oneapi-mpi@2021.3.0 generic-names=true %gcc@10.2.0
      prefix: /p/app/compilers/intel/2021.3.0
      modules:
      - Master
      - prgenv-gnu-intelmpi/10.2.0-2021.3.0
  gcc-runtime:
    externals:
    - spec: gcc-runtime@10.2.0%gcc@10.2.0
      prefix: /p/app/compilers/gcc/10.2.0
