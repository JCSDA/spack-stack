packages:
  all:
    compiler:: [oneapi@2025.0.4, gcc@10.2.0]
    providers:
      mpi:: [intel-oneapi-mpi@2021.14]
  mpi:
    buildable: False
  intel-oneapi-mpi:
    externals:
    - spec: intel-oneapi-mpi@2021.14%oneapi@2025.0.4
      modules:
      - Master
      - prgenv-intel-intelmpi/2023.1.0-2021.9.0
      - mpi/2021.14
  intel-oneapi-mkl:
    externals:
    - spec: intel-oneapi-mkl@2025.0%oneapi@2025.0.4
      prefix: /p/app/compilers/intel/2025.0.1.47
  intel-oneapi-tbb:
    externals:
    - spec: intel-oneapi-tbb@2022.0%oneapi@2025.0.4
      prefix: /p/app/compilers/intel/2025.0.1.47
  intel-oneapi-runtime:
    externals:
    - spec: intel-oneapi-runtime@2025.0.4%oneapi@2025.0.4
      prefix: /p/app/compilers/intel/2025.0.1.47
  gcc-runtime:
    externals:
    - spec: gcc-runtime@10.2.0%gcc@10.2.0
      prefix: /p/app/compilers/gcc/10.2.0
