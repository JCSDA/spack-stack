packages:
  all:
    require:
    - any_of: ['%gcc@=15.2.0']
      when: '%gcc'
  mpi:
    buildable: false
    require: [openmpi@=5.0.4]
  gcc:
    buildable: false
    externals:
    - spec: gcc@=15.2.0 languages:='c,c++,fortran'
      prefix: /ford1/share/gmao_SIteam/gcc/gcc-15.2.0
      extra_attributes:
        compilers:
          c: /ford1/share/gmao_SIteam/gcc/gcc-15.2.0/bin/gcc
          cxx: /ford1/share/gmao_SIteam/gcc/gcc-15.2.0/bin/g++
          fortran: /ford1/share/gmao_SIteam/gcc/gcc-15.2.0/bin/gfortran
  openmpi:
    buildable: false
    externals:
    # Built with internal hwloc/pmix/libevent, no ucx/slurm/lustre. The
    # ~internal-hwloc flag only satisfies the common/packages.yaml requirement.
    - spec: openmpi@=5.0.4 ~cuda~cxx~cxx_exceptions~java~memchecker~static~wrapper-rpath~internal-hwloc+two_level_namespace %gcc@=15.2.0
      prefix: /ford1/share/gmao_SIteam/MPI/openmpi/5.0.4/gcc-15.2.0
