packages:
  all:
    require:
    - any_of: ['%intel-oneapi-compilers@=2024.2.0']
      when: '%intel-oneapi-compilers'
    - any_of: ['%gcc@=12.5.0']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    # Select mpiifort for the ifort compiler stack instead of the default mpiifx.
    - "intel-oneapi-mpi@=2021.13 +classic-names"
  intel-oneapi-compilers:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers@=2024.2.0 +fix_rt_linkage
      prefix: /ford1/share/gmao_SIteam/intel/oneapi
      extra_attributes:
        compilers:
          c: /ford1/share/gmao_SIteam/intel/oneapi/compiler/2024.2/bin/icx
          cxx: /ford1/share/gmao_SIteam/intel/oneapi/compiler/2024.2/bin/icpx
          fortran: /ford1/share/gmao_SIteam/intel/oneapi/compiler/2024.2/bin/ifort
        environment:
          prepend_path:
            PATH: /ford1/share/gmao_SIteam/gcc/gcc-12.5.0/bin
            CPATH: /ford1/share/gmao_SIteam/gcc/gcc-12.5.0/include
            LD_LIBRARY_PATH: '/ford1/share/gmao_SIteam/gcc/gcc-12.5.0/lib64'
        extra_rpaths:
        - /ford1/share/gmao_SIteam/gcc/gcc-12.5.0/lib64
  gcc:
    buildable: false
    externals:
    - spec: gcc@=12.5.0 languages:='c,c++'
      prefix: /ford1/share/gmao_SIteam/gcc/gcc-12.5.0
      extra_attributes:
        compilers:
          c: /ford1/share/gmao_SIteam/gcc/gcc-12.5.0/bin/gcc
          cxx: /ford1/share/gmao_SIteam/gcc/gcc-12.5.0/bin/g++
  intel-oneapi-mpi:
    buildable: false
    externals:
    - spec: intel-oneapi-mpi@=2021.13
      prefix: /ford1/share/gmao_SIteam/intel/oneapi
  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@=2024.2
      prefix: /ford1/share/gmao_SIteam/intel/oneapi
