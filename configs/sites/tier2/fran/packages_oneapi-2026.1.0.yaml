packages:
  all:
    require:
    - any_of: ['%intel-oneapi-compilers@=2026.1.0']
      when: '%intel-oneapi-compilers'
    - any_of: ['%gcc@=14.2.1']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - cray-mpich@9.0.1
  intel-oneapi-compilers:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers@2026.1.0 +fix_rt_linkage
      prefix: /p/work1/heinzell/spack-stack/oneapi-2026.1.0
      modules:
      - PrgEnv-intel/8.6.0
      - intel-oneapi/2026.1.0
      extra_attributes:
        compilers:
          c: /p/work1/heinzell/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icx
          cxx: /p/work1/heinzell/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icpx
          fortran: /p/work1/heinzell/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/ifx
        environment:
          set:
            CONFIG_SITE: ''
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.2.1 languages:='c,c++'
      prefix: /opt/rh/gcc-toolset-14/root/usr
      modules:
      - PrgEnv-gnu/8.6.0
      - gcc-native/14
      extra_attributes:
        compilers:
          c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          fortran: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
        environment:
          set:
            CONFIG_SITE: ''
            PE_GCC_EXTERNAL: native
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.0.1
      prefix: /opt/cray/pe/mpich/9.0.1/ofi/intel/2022.1
      modules:
      - cray-mpich/9.0.1
  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@2026.1
      prefix: /p/work1/heinzell/spack-stack/oneapi-2026.1.0
