packages:
  all:
    require:
    - any_of: ['%gcc@=14.2.1']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - cray-mpich@9.0.1
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.2.1 languages:='c,c++,fortran'
      prefix: /opt/rh/gcc-toolset-14/root/usr
      modules:
      - PrgEnv-gnu/8.6.0
      - gcc-native/14
      extra_attributes:
        compilers:
          c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          fortran: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
        environment:
          set:
            CONFIG_SITE: ''
            PE_GCC_EXTERNAL: native
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.0.1
      prefix: /opt/cray/pe/mpich/9.0.1/ofi/gnu/11.2
      modules:
      - cray-mpich/9.0.1
