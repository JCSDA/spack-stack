packages:
  all:
    require:
    - any_of: ['%intel-oneapi-compilers@=2026.1.0']
      when: '%intel-oneapi-compilers'
    - any_of: ['%gcc@=13.3.0']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - cray-mpich@8.1.30
  intel-oneapi-compilers:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers@2026.1.0 +fix_rt_linkage
      prefix: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0
      modules:
      - PrgEnv-intel/8.5.0
      - intel-oneapi/2026.1.0
      extra_attributes:
        compilers:
          c: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icx
          cxx: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icpx
          fortran: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/ifx
        environment:
          set:
            CONFIG_SITE: ''
  gcc:
    buildable: false
    externals:
    - spec: gcc@13.3.0 languages:='c,c++,fortran'
      prefix: /usr
      modules:
      - PrgEnv-gnu/8.5.0
      - gcc-native/13.2
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-13
          cxx: /usr/bin/g++-13
          fortran: /usr/bin/gfortran-13
        environment:
          set:
            CONFIG_SITE: ''
            PE_GCC_EXTERNAL: native
        extra_rpaths:
        - /opt/cray/libfabric/1.22.0/lib64
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.30
      prefix: /opt/cray/pe/mpich/8.1.30/ucx/intel/2022.1
      modules:
      - cray-mpich-ucx/8.1.30
      extra_attributes:
        extra_rpaths:
        - /opt/cray/libfabric/1.22.0/lib64
  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@2026.1
      prefix: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0
