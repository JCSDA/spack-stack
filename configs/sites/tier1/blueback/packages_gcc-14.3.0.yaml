packages:
  all:
    require:
    - any_of: ['%gcc@=14.3.0']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - cray-mpich@8.1.32
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.3.0 languages:='c,c++,fortran'
      prefix: /usr
      modules:
      - PrgEnv-gnu/8.6.0
      - gcc-native/14.2
      extra_attributes:
        compilers:
          c: /opt/cray/pe/gcc-native/14/bin/gcc
          cxx: /opt/cray/pe/gcc-native/14/bin/g++
          fortran: /opt/cray/pe/gcc-native/14/bin/gfortran
        environment:
          set:
            CONFIG_SITE: ''
            PE_GCC_EXTERNAL: native
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@8.1.32
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/GNU/12.3
      modules:
      - libfabric/2.3.1
      - craype-network-ofi
      - cray-mpich/8.1.32
      extra_attributes:
        environment:
          prepend_path:
            CMAKE_PREFIX_PATH: /p/app/projects/NEPTUNE/spack-stack/cmake-findmpi
