deployments:
  - template: "unified-dev"
    compilers: ["oneapi@2024.2.1", "intel@19.1.3.304"]
    packages_to_install:
    - ufs-weather-model-env
    - global-workflow-env
    - gsi-env
    - madis
    only_concretize_requested_packages: true
    duplicates_to_ignore: ["esmf", "mapl", "py-cython"]
    allowed_gcc_packages:
    - antlr
    - bison
    - cmake
    - gcc
    - gettext
    - gmake
    - go
    - ninja
    - py-numpy

  - template: "nco"
    compilers: ["oneapi@2024.2.1", "intel@19.1.3.304"]
    duplicates_to_ignore: ["crtm", "crtm-fix", "boost", "harfbuzz"]
    allowed_gcc_packages:
    - antlr
    - apr
    - bison
    - boost
    - cmake
    - gcc
    - gettext
    - glib
    - gmake
    - go
    - harfbuzz
    - icu4c
    - libbsd
    - ninja
    - pixman
    - py-numpy
    - qt
    - subversion
    walltime: 03:15:00
    site: wcoss2

batch_config:
  scheduler: pbspro
  account: NCEPLIBS-DEV
  queue: dev
  default_walltime: 02:30:00
