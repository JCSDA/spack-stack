packages:
  all:
    require:
    - any_of: ['%llvm@=22.1.7']
      when: '%llvm'
  mpi:
    buildable: False
    require:
    - "openmpi@4.1.8"
  llvm:
    externals:
    - spec: llvm@22.1.7 +flang ~libomptarget
      prefix: /gpfs/neptune/spack-stack/llvm-22.1.7
      modules:
      - llvm/22.1.7
      extra_attributes:
        compilers:
          c: /gpfs/neptune/spack-stack/llvm-22.1.7/bin/clang
          cxx: /gpfs/neptune/spack-stack/llvm-22.1.7/bin/clang++
          fortran: /gpfs/neptune/spack-stack/llvm-22.1.7/bin/flang-new
        extra_rpaths:
        - /gpfs/neptune/spack-stack/llvm-22.1.7/lib
        - /gpfs/neptune/spack-stack/llvm-22.1.7/lib/x86_64-unknown-linux-gnu
  hwloc:
    buildable: False
    externals:
    - spec: hwloc@2.13.0
      prefix: /gpfs/neptune/spack-stack/llvm-22.1.7
  openmpi:
    externals:
    - spec: openmpi@4.1.8 ~internal-hwloc +two_level_namespace
      prefix: /gpfs/neptune/spack-stack/openmpi-4.1.8/llvm-22.1.7
      modules:
      - llvm/22.1.7
      - openmpi/4.1.8
