packages:
  mpi:
    buildable: False
    require:
    - "intel-oneapi-mpi@2021.17"
  intel-oneapi-compilers:
    externals:
    - spec: intel-oneapi-compilers@2025.3.0
      prefix: /project/spack-stack/oneapi-2025.3.0
      modules:
      - umf/1.0
      - tbb/2022.3
      - compiler-rt/2025.3.0
      - compiler/2025.3.0
      extra_attributes:
        compilers:
          c: /project/spack-stack/oneapi-2025.3.0/compiler/2025.3/bin/icx
          cxx: /project/spack-stack/oneapi-2025.3.0/compiler/2025.3/bin/icpx
          fortran: /project/spack-stack/oneapi-2025.3.0/compiler/2025.3/bin/ifx
  intel-oneapi-mpi:
    buildable: false
    externals:
    - spec: intel-oneapi-mpi@2021.17
      prefix: /project/spack-stack/oneapi-2025.3.0
      modules:
      - mpi/2021.17
  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@2025.3
      prefix: /project/spack-stack/oneapi-2025.3.0
      modules:
      - mkl/2025.3
  intel-oneapi-tbb:
    buildable: false
    externals:
    - spec: intel-oneapi-tbb@2022.3
      prefix: /project/spack-stack/oneapi-2025.3.0
      modules:
      - tbb/2022.3
  intel-oneapi-runtime:
    buildable: false
    externals:
    - spec: intel-oneapi-runtime@2025.3.0
      prefix: /project/spack-stack/oneapi-2025.3.0
      modules:
      - umf/1.0
      - tbb/2022.3
      - compiler-rt/2025.3.0
  gcc:
    buildable: false
    externals:
    - spec: gcc@11.5.0 languages:='c,c++'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  gcc-runtime:
    buildable: false
    externals:
    - spec: gcc-runtime@11.5.0
      prefix: /usr
