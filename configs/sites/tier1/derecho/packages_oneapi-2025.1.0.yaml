packages:
  mpi:
    buildable: False
  cray-mpich:
    buildable: False
    externals:
    - spec: cray-mpich@8.1.29 +wrappers
      prefix: /opt/cray/pe/mpich/8.1.29/ofi/intel/2022.1
      modules:
      - ncarenv/24.12
      - craype/2.7.31
      - cray-mpich/8.1.29
      - libfabric/1.15.2.0
      - cray-pals/1.2.11

  intel-oneapi-runtime:
    buildable: False
    externals:
    - spec: intel-oneapi-runtime@2025.1.0
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2025.1.0/gcc/12.4.0/47hn
      modules:
        - ncarenv/24.12
        - intel/2025.1.0

  intel-oneapi-compilers:
    buildable: False
    externals:
    - spec: intel-oneapi-compilers@2025.1.0
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2025.1.0/gcc/12.4.0/47hn
      modules:
        - ncarenv/24.12
        - intel/2025.1.0
      extra_attributes:
        compilers:
          c: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2025.1.0/gcc/12.4.0/47hn/compiler/2025.1/bin/icx
          cxx: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2025.1.0/gcc/12.4.0/47hn/compiler/2025.1/bin/icpx
          fortran: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2025.1.0/gcc/12.4.0/47hn/compiler/2025.1/bin/ifx
        environment:
          prepend_path:
            PATH: '/glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin'
            CPATH: '/glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/include'
            LD_LIBRARY_PATH: '/glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/lib:/glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/lib64'
          set:
            # https://github.com/JCSDA/spack-stack/issues/957
            FI_CXI_RX_MATCH_MODE: 'hybrid'
            # https://github.com/JCSDA/spack-stack/issues/1012
            I_MPI_EXTRA_FILESYSTEM: 'ON'
        extra_rpaths: []

  intel-oneapi-mkl:
    buildable: False
    externals:
    - spec: intel-oneapi-mkl@2025.1.0
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-mkl/2025.1.0/oneapi/2025.1.0/f76g
      modules:
      - intel-oneapi-mkl/2025.1.0

  gcc-runtime:
    buildable: False
    externals:
    - spec: gcc-runtime@12.4.0
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c

  gcc:
    buildable: False
    externals:
    - spec: gcc@12.4.0 languages:='c,c++'
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c
      modules:
      - ncarenv/24.12
      - gcc/12.4.0
      extra_attributes:
        compilers:
          c: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/gcc
          cxx: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/g++
          fortran: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/gfortran
        environment:
          prepend_path:
            # For compiling scotch (which requires Intel MPI) with gcc in the oneapi@2024.2.1 unified environment
            LD_LIBRARY_PATH: '/glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2024.2.1/gcc/12.4.0/iq3b/compiler/2024.2/lib'
          set:
            # https://github.com/JCSDA/spack-stack/issues/957
            FI_CXI_RX_MATCH_MODE: 'hybrid'
        extra_rpaths: []
