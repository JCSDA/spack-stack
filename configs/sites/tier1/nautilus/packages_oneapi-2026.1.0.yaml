packages:
  all:
    require:
    - any_of: ['%intel-oneapi-compilers@=2026.1.0']
      when: '%intel-oneapi-compilers'
    - any_of: ['%gcc@=11.2.1']
      when: '%gcc'
  mpi:
    buildable: false
    require:
    - intel-oneapi-mpi@2021.18
  intel-oneapi-compilers:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers@2026.1.0 +fix_rt_linkage
      prefix: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0
      modules:
      - tbb/2023.1
      - umf/1.1.0
      - tcm/1.5
      - compiler-rt/2026.1.0
      - compiler-intel-llvm/2026.1.0
      extra_attributes:
        compilers:
          c: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icx
          cxx: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/icpx
          fortran: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0/compiler/2026.1/bin/ifx
        environment:
          prepend_path:
            PATH: /opt/rh/gcc-toolset-11/root/usr/bin
            CPATH: /opt/rh/gcc-toolset-11/root/usr/include
        extra_rpaths:
        - /opt/rh/gcc-toolset-11/root/usr/lib64
        - /opt/rh/gcc-toolset-11/root/usr/lib
  gcc:
    buildable: false
    externals:
    - spec: gcc@11.2.1 languages:='c,c++'
      prefix: /opt/rh/gcc-toolset-11/root/usr
      modules:
      - scl/gcc-toolset-11
      extra_attributes:
        compilers:
          c: /opt/rh/gcc-toolset-11/root/usr/bin/gcc
          cxx: /opt/rh/gcc-toolset-11/root/usr/bin/g++
          fortran: /opt/rh/gcc-toolset-11/root/usr/bin/gfortran
  intel-oneapi-mpi:
    buildable: false
    externals:
    - spec: intel-oneapi-mpi@2021.18
      prefix: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0
      modules:
      - mpi/2021.18
      - slurm
  intel-oneapi-mkl:
    buildable: false
    externals:
    - spec: intel-oneapi-mkl@2026.1
      prefix: /p/app/projects/NEPTUNE/spack-stack/oneapi-2026.1.0
