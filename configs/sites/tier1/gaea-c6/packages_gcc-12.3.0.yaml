packages:
  all:
    require:
    - any_of: ['gcc@=12.3.0']
      when: '%gcc'
  mpi:
    buildable: False
  cray-mpich:
    buildable: False
    externals:
    - spec: cray-mpich@8.1.32 +wrappers
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/gnu/12.3
      modules:
      - PrgEnv-gnu/8.5.0
      - craype/2.7.34
      - craype-network-ofi
      - cray-mpich/8.1.32
      - libfabric/1.22.0
  gcc:
    buildable: False
    externals:
    - spec: gcc@12.3.0 languages:='c,c++,fortran'
      prefix: /opt/cray/pe/gcc-native/12/bin
      modules:
        - PrgEnv-gnu/8.5.0
        - craype/2.7.34
        - gcc-native/12.3
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
          fortran: /usr/bin/gfortran-12
        environment:
          prepend_path:
            LD_LIBRARY_PATH: '/opt/cray/libfabric/1.22.0/lib64:/opt/cray/pe/libsci/25.09.0/GNU/12.3/x86_64/lib:/usr/lib64/gcc/x86_64-suse-linux/12'
