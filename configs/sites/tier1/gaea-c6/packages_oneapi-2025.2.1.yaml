packages:
  all:
    require:
    - any_of: ['%intel-oneapi-compilers@=2025.2.1']
      when: '%intel-oneapi-compilers'
    - any_of: ['%gcc@=12.3.0']
      when: '%gcc'
  mpi:
    buildable: False
  cray-mpich:
    buildable: False
    - spec: cray-mpich@8.1.32 +wrappers
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/intel/2022.1
      modules:
      - PrgEnv-intel/8.6.0
      - craype/2.7.34
      - cray-mpich/8.1.32
      - libfabric/1.22.0
      - craype-network-ofi
  intel-oneapi-compilers:
    buildable: False
    externals:
    - spec: intel-oneapi-compilers@2025.2.1
      prefix: /opt/intel/oneapi
      modules:
        - PrgEnv-intel/8.6.0
        - intel/2025.2
        - craype/2.7.34
        #- cray-libsci/25.03.0
        #- libfabric/1.22.0
      extra_attributes:
        compilers:
          c: /opt/intel/oneapi/compiler/2025.2/bin/icx
          cxx: /opt/intel/oneapi/compiler/2025.2/bin/icpx
          fortran: /opt/intel/oneapi/compiler/2025.2/bin/ifx
        environment:
          prepend_path:
            LD_LIBRARY_PATH: '/opt/cray/libfabric/1.22.0/lib64:/opt/cray/pe/libsci/25.03.0/INTEL/2025.0/x86_64/lib:/usr/lib64/gcc/x86_64-suse-linux/12:/opt/intel/oneapi/compiler/2025.2/lib:/opt/cray/pe/mpich/8.1.32/ofi/intel/2022.1/lib'
          set:
            # OpenSUSE on Gaea C6 sets CONFIG_SITE so
            # Automake-based builds are installed in lib64
            # which confuses some packages.
            CONFIG_SITE: ''
  intel-oneapi-mkl:
    buildable: False
    externals:
    - spec: intel-oneapi-mkl@2025.2
      prefix: /opt/intel/oneapi
  gcc:
    buildable: False
    externals:
    - spec: gcc@12.3.0 languages:='c,c++'
      prefix: /opt/cray/pe/gcc-native/12/bin
      modules:
        - PrgEnv-gnu/8.5.0
        - gcc-native/12.3
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
          fortran: /usr/bin/gfortran-12
        environment: 
          set:
            PE_GCC_EXTERNAL: native
            #FI_CXI_RX_MATCH_MODE: hybrid
