packages:
  all:
    require:
    - any_of: ['gcc@=16.1.0']
      when: '%gcc'
  mpi:
    buildable: False
    require:
    - cray-mpich@9.2.0
  cray-mpich:
    buildable: False
    externals:
    - spec: cray-mpich@9.2.0
      prefix: /opt/cray/pe/mpich/9.0.1/ofi/gnu/11.2
      modules:
      - libfabric/2.5.1
      - cray-mpich/9.2.0
  gcc:
    buildable: False
    externals:
    - spec: gcc@16.1.0 languages:='c,c++,fortran'
      prefix: /sw/gaea-c7/gcc/16.1.0/bin
      modules:
        - gcc/16.1.0
      extra_attributes:
        compilers:
          c: /sw/gaea-c7/gcc/16.1.0/bin/gcc
          cxx: /sw/gaea-c7/gcc/16.1.0/bin/g++
          fortran: /sw/gaea-c7/gcc/16.1.0/bin/gfortran
        environment:
          set:
            PE_GCC_EXTERNAL: native
          prepend_path:
            LD_LIBRARY_PATH: '/opt/cray/libfabric/1.20.1/lib64:/opt/cray/pe/libsci/25.09.0/GNU/12.2/x86_64/lib:/usr/lib/gcc/x86_64-redhat-linux/11'
