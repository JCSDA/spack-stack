packages:
    # Compiler preferences
    c:
      prefer:
      - intel-oneapi-compilers
    cxx:
      prefer:
      - intel-oneapi-compilers
    fortran:
      prefer:
      - intel-oneapi-compilers
    # Virtual package settings
    blas:
      require:
      - intel-oneapi-mkl
    fftw-api:
      require:
      - intel-oneapi-mkl
    lapack:
      require:
      - intel-oneapi-mkl
    # Individual package settings
    antlr:
      require:
      - '%c,cxx=gcc'
    bison:
      require:
      - '%c,cxx=gcc'
    # pango/harfbuzz/gobject-introspection need cairo+gobject; without pinning it
    # the concretizer builds cairo both ways and the two collide on one modulefile.
    cairo:
      require:
      - +gobject
    cmake:
      require:
      - '%c,cxx=gcc'
    ectrans:
      require:
      - +mkl
      - ~fftw
    elfutils:
      require:
      - '@0.191:'
    libelf:
      buildable: false
    gmake:
      require:
      - '%c=gcc'
    go:
      require:
      - '%c,cxx=gcc'
    libbsd:
      require:
      - '%c=gcc'
    libmd:
      require:
      - '%c=gcc'
    met:
      require:
      - +shared-intel
    nco:
      require:
      - '%c,cxx=gcc'
    # The py-numpy cannot be built with oneAPI.
    py-numpy:
      require:
      - '%c,cxx=gcc'
    oops:
      require:
      - +mkl
    parallel-netcdf:
      require:
      - +shared-intel
    patchelf:
      require:
      - '%c=gcc'
    # Require a recent py-sphinx; unpinned the concretizer prefers 6.X. The old sphinx creates version
    # splits in py-attrs, py-docutils, and py-eccodes affecting jedi-base-env and jedi-fv3-env.
    py-sphinx:
      require:
      - '@9:'
    py-maturin:
      require:
      - '%c=gcc'
    py-scipy:
      require:
      - 'cxxflags="-O1"'
    # Each site must either set qt:buildable:false or set require gcc in its own packages_oneapi-<version>.yaml
    #qt:
    #  require:
    #  - '%c,cxx=gcc'
    rust:
      require:
      - '%c,cxx=gcc'
