packages:
    # Allow certain packages to be built with GCC as long as they only use
    # C and/or C++. Because Fortran compilers are not ABI compatible, we
    # need to force spack to use one and only one compiler (Intel oneAPI)
    c:
      require:
      - one_of: ['intel-oneapi-compilers', 'gcc']
      prefer:
      - 'intel-oneapi-compilers'
    cxx:
      require:
      - one_of: ['intel-oneapi-compilers', 'gcc']
      prefer:
      - 'intel-oneapi-compilers'
    fortran:
      require:
      - 'intel-oneapi-compilers'
    all:
      require:
      - '%[when=%c]oneapi %[when=%cxx]oneapi %[when=%fortran]oneapi'
      providers:
        blas: [intel-oneapi-mkl]
        fftw-api: [intel-oneapi-mkl]
        lapack: [intel-oneapi-mkl]
    antlr:
      require:
      - '%gcc'
    bison:
      require:
      - '%gcc'
    boost:
      require:
      - '%oneapi'
    cmake:
      require:
      - '%gcc'
    ectrans:
      require:
      - +mkl ~fftw
    gmake:
      require:
      - '%gcc'
    gsibec:
      require:
      - +mkl
    libbsd:
      require:
      - '%gcc'
    libmd:
      require:
      - '%gcc'
    met:
      require:
      - +shared-intel
    netcdf-c:
      require:
      - '%oneapi'
    netcdf-cxx:
      require:
      - '%oneapi'
    nco:
      require:
      - '%gcc'
    p4est:
      require:
      - '%oneapi'
    parallel-netcdf:
      require:
      - +shared-intel
    python:
      require:
      - '%gcc'
    py-cython:
      require:
      - '%gcc'
    py-numpy:
      require:
      - '%gcc'
      - '^intel-oneapi-mkl'
    py-pandas:
      require:
      - '%gcc'
    py-scipy:
      require:
      - '%gcc'
    py-xarray:
      require:
      - '%gcc'
    qt:
      require:
      - '%gcc'
    scotch:
      require:
      - '%gcc'
