packages:
  # Compiler preferences
  c:
    prefer:
    - nvhpc
  cxx:
    prefer:
    - nvhpc
  fortran:
    prefer:
    - nvhpc
  # Virtual provider settings
  blas:
    require:
    - nvhpc
  fftw-api:
    require:
    - fftw
    #- nvpl-fft
  lapack:
    require:
    - nvhpc
  # Individual package settings
  util-linux-uuid:
    require:
    - '%c,cxx=gcc'
  antlr:
    require:
    - '%c,cxx=gcc'
  bison:
    require:
    - '%c,cxx=gcc'
  cmake:
    require:
    - '%c,cxx=gcc'
  curl:
    require:
    - '%c=gcc'
  ectrans:
    require:
    - +fftw
  file:
    require:
    - '%c=gcc'
  # nvfortran does not support REAL(16)
  fms:
    require::
    - spec: precision=32,64
      when: '@:2025.03'
    - spec: precision=mixed
      when: '@2025.04:'
    - ~quad_precision
    - +openmp
    - +pic
    - +yaml
    - build_type=Release
    - any_of:
      - '@=2025.03'
      - '@=2024.03'
      - '@=2026.01.01'
    - any_of:
      - +gfs_phys constants=GFS
      - ~gfs_phys constants=GEOS
  gmake:
    require:
    - '%c=gcc'
  go:
    require:
    - '%c,cxx=gcc'
  # https://github.com/NOAA-EMC/NCEPLIBS-ip/issues/320
  ip:
    require:
    - ~openmp
  libbsd:
    require:
    - '%c=gcc'
  libffi:
    require:
    - '%c=gcc'
  libiconv:
    require:
    - '%c=gcc'
  libmd:
    require:
    - '%c=gcc'
  libxml2:
    require:
    - '%c=gcc'
  # pflogger 1.18.1 does not compile with nvfortran
  mapl:
    require::
    - '@2.69'
    - ~shared
    - ~f2py
    - ~pflogger
  ninja:
    require:
    - '%c=gcc'
  nco:
    require:
    - '%c,cxx=gcc'
  numactl:
    require:
    - '%c=gcc'
  patchelf:
    require:
    - '%c=gcc'
  pkg-config:
    require:
    - '%c=gcc'
  python:
    require:
    - '%c=gcc'
  py-cython:
    require:
    - '%c=gcc'
  py-mpi4py:
    require:
    - '%c,cxx=gcc'  
  py-numpy:
    require:
    - '%c,cxx=gcc'
  py-pyyaml:
    require:
    - '@=6.0.3'
    - +libyaml
  rust:
    require:
    - '%c,cxx=gcc'
  zstd:
    require:
    - '%c,cxx=gcc'
