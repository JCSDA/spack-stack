packages:
    # Virtual provider settings
    jpeg:
      require:
      - libjpeg-turbo
    pkgconfig:
      require:
      - pkg-config
    yacc:
      require:
      - bison
    zlib-api:
      require:
      - zlib
    # Individual package settings
    awscli-v2:
      require:
      - ~examples
    bacio:
      require:
      - '@2.6.0'
    bison:
      require:
      - '@3.4:'
    boost:
      require:
      - '@1.84.0'
      - ~atomic
      - +chrono
      - +date_time
      - +exception
      - +filesystem
      - ~graph
      - ~iostreams
      - ~locale
      - ~log
      - ~math
      - ~mpi
      - ~numpy
      - +pic
      - +program_options
      - +python
      - ~random
      - +regex
      - +serialization
      - +system
      - +test
      - +thread
      - +timer
      - ~wave
      - cxxstd=17
      - visibility=hidden
    bufr:
      require:
      - '@12.3.0'
      - +python
    bufr-query:
      require:
      - '@0.0.5'
      - +python
    cdo:
      require:
      - ~openmp
      - any_of:
        - '@2.3.0'
        when: '%intel@2021:'
        message: 2.3.0 is the last version to use C++17, use with Intel Classic
      - any_of:
        - '@2.3.0'
        when: '%gcc@:10'
        message: 2.3.0 is the last version to use C++17, use with GCC 10 and earlier
      - any_of:
        - '@2.3.0'
        when: '%apple-clang@:14'
        message: 2.3.0 is the last version to use C++17, use with Apple Clang 14 and earlier
      - any_of:
        - '@2.0.5'
        when: '%intel@:2020'
        message: 2.0.5 is the last version to use C++14, use with Intel Classic 2020 and earlier
    cmake:
      require:
      - '@3.29:'
      - +ownlibs
    codee:
      require:
      - '@2026.1.2'
    crtm_fix:
      require:
      - ~link-big-endian
      - +link-little-endian
      - +link-netcdf
      - +link-testfiles
    # Attention - when updating also check the various jcsda-emc-bundles env packages
    crtm:
      require:
      - +fix
    ecbuild:
      require:
      - '@3.15.2'
    eccodes:
      require:
      - '@2.33.0'
      - +netcdf
      - +png
      - +tools
    ecflow:
      require:
      # ecFlow 5.18.0 supports CMake 4; older releases require CMake 3.
      - '@5.18.0'
      - +ui
    eckit:
      require:
      - '@2.0.7'
      - linalg=eigen,lapack
      - compression=lz4,bzip2
    ecmwf-atlas:
      require:
      - '@0.46.0'
      - +fckit
      - +trans
      - +tesselation
      - +fftw
    ectrans:
      require:
      - '@1.8.0'
    eigen:
      require:
      - '@3.4.0'
    # Attention - when updating the version also check the common modules.yaml
    # config and update the projections for lmod/tcl.
    # Also, check the acorn and derecho site configs which have esmf modifications.
    esmf:
      require:
      - ~xerces
      - ~pnetcdf
      - +shared
      - +external-parallelio
      - any_of:
        - '@=8.6.1 snapshot=none'
        - '@=8.8.0 snapshot=none'
        - '@=8.9.1 snapshot=none'
        - '@=9.0.0b11 snapshot=b11'
      - any_of:
        - 'fflags="-fp-model precise" cxxflags="-fp-model precise"'
        when: '%intel'
        message: Extra ESMF compile options for Intel
    expat:
      require:
      - ~libbsd
    fckit:
      require:
      - '@0.14.3'
      - +eckit
    ffmpeg:
      require:
      - ~gpl
      - ~nonfree
    fftw:
      require:
      - '@3.3.10'
    fiat:
      require:
      - '@2.0.0'
    flex:
      require:
      - '@2.6.4'
    fms:
      require:
      - spec: precision=32,64
        when: '@:2025.03'
      - spec: precision=mixed
        when: '@2025.04:'
      - +quad_precision
      - +openmp
      - +pic
      - +yaml
      - build_type=Release
      - any_of:
        - '@=2025.03'
        - '@=2024.03'
        - '@=2026.01.01'
      - any_of:
        - +gfs_phys constants=GFS
        - ~gfs_phys constants=GEOS
    fontconfig:
      require:
      - +pic
    freetype:
      require:
      - +pic
    g2:
      require:
      - '@3.5.1'
    g2c:
      require:
      - '@2.3.0'
    g2tmpl:
      require:
      - '@1.17.0'
    # This version builds with Intel oneAPI compilers, newer/older versions don't
    gdal:
      require:
      - '@3.10.2'
    # *DH
    gfsio:
      require:
      - '@1.4.2'
    # py-greenlet@:3.0 requires python@:3.12; @3.1: has no upper cap
    py-greenlet:
      require:
      - '@3.1:'
    # 2025.7.0 supports Python 3.13 without Dask 2026's Setuptools-SCM 9 requirement.
    py-dask:
      require:
      - '@2025.7.0'
    global-workflow-env:
      require:
      - '+uwtools'
      - '+gdas'
      - '+gsi'
      - '+metplus'
      - '+ci'
    grib-util:
      require:
      - '@1.4.0'
    gsibec:
      require:
      - '@1.4.2'
    gsi-ncdiag:
      require:
      - '@1.1.3'
    harfbuzz:
      # cmake-based harfbuzz fails during build; autotools is only available
      # for the deprecated @2.9.1 which doesn't compile against ICU >= 76
      # (-Werror=redundant-decls on u_strlen). Force meson.
      # cmake-based harfbuzz fails during build
      # requiring +gobject eliminates a duplicate copy of harfbuzz in the unified-env
      # due to global-workflow-env deps requesting a non-default variant
      require:
      - 'build_system=meson'
      - +gobject
    hdf:
      require:
      - '@4.2.15'
      - +external-xdr
      - ~fortran
      - ~netcdf
    hdf5:
      require:
      - '@2.1.0'
      - +hl
      - +fortran
      - +mpi
      - +threadsafe
      - ~szip
    # Newer versions of hdf-eos2 require manual downloading, avoid
    hdf-eos2:
      require:
      - '@2.20v1.00'
    intel-oneapi-compilers-runtime:
      require:
      - '%oneapi'
    intel-oneapi-compilers-classic-runtime:
      require:
      - '%intel'
    ip:
      require:
      - '@5.4.0'
      - precision=4,d,8
    ip2:
      require:
      - '@1.1.2'
    jedi-cmake:
      require:
      - '@1.4.0'
    kokkos:
      require:
      - '@5.1.1'
      - +openmp
      - +serial
    kokkos-kernels:
      require:
      - '@5.1.1'
      - +openmp
      - +serial
    landsfcutil:
      require:
      - '@2.4.2'
    # https://github.com/JCSDA/spack-stack/actions/runs/20957699537/job/60226338267
    libaec:
      prefer:
      - build_system=cmake
      - generator=make
    # https://github.com/JCSDA/spack-stack/issues/2058
    libbacktrace:
      require:
      - +shared
    libpng:
      require:
      - '@1.6.55'
      - +pic
    # libtirpc +gssapi doesn't build with oneapi@2025
    # https://github.com/JCSDA/spack-stack/issues/1441
    libtirpc:
      require:
      - ~gssapi
    # Newest version of magics needed for oneapi compilers
    magics:
      require:
      - '@4.15.3:'
    mapl:
      require:
      - '@2.53'
      - ~shared
      - ~f2py
      - +pflogger
    met:
      require:
      - '@12.1.1'
      - +python
      - +grib2
    metplus:
      require:
      - '@6.1.0'
    metis:
      require:
      - +int64
      - +real64
    mpich:
      require:
      - ~hwloc
    nco:
      require:
      - ~doc
    # ncview - check Orion and Discover site configs
    nemsio:
      require:
      - '@2.5.5'
    nemsiogfs:
      require:
      - '@2.5.4'
    # Note: per spack, the first is "preferred", so if you
    # need 1.9.0.1, you need to explicitly request it in your spec.
    nccmp:
      require:
      - any_of:
        - '@1.11.0.0'
        - '@1.9.0.1'
    ncio:
      require:
      - '@1.1.2'
    netcdf-c:
      require:
      - '@4.9.2'
      - +dap
      - +mpi
      - ~parallel-netcdf
      - ~szip
      - +parallel_tests
      - build_system=cmake
    netcdf-cxx4:
      require:
      - '@4.3.1'
    netcdf-fortran:
      require:
      - '@4.6.1'
      - +parallel_tests
    # ninja - when adding information here, also check Discover site config
    odc:
      require:
      - '@1.6.3'
      - ~fortran
    openmpi:
      require:
      - +two_level_namespace
    openssl:
      require:
      - +shared
      - '@3'
    p4est:
      require:
      - '@2.8.7'
    # pmix+docs pulls in py-recommonmark -> py-sphinx@:6.1 -> python@:3.12
    pmix:
      require:
      - ~docs
    # Earlier versions of pango don't build on Blueback because of
    # a bug in finding the correct Python interpreter from spack.
    pango:
      require:
      - '@1.54:'
    parallelio:
      require:
      - '@2.6.2'
      - +pnetcdf
    # 1.14.1 fixes a GCC 15 build failure. The old oneAPI shared-intel
    # linkage workaround applied only to 1.12.3 and is intentionally not used.
    parallel-netcdf:
      require:
      - '@1.14.1'
    pflogger:
      require:
      - +mpi
    pfunit:
      require:
      - +mpi
      - +fhamcrest
    pixman:
      require:
      - +pic
    prod-util:
      require:
      - '@2.1.2'
    proj:
      require:
      - ~tiff
    # Turn off crypt variant for Python; this leads to build errors
    # with Intel in py-cryptography unless external curl and openssl
    # are removed, which itself is problematic.
    # Note: crypt variant only exists for python@:3.12; python@3.13 removed it entirely.
    python:
      require:
      - '@3.13'
    # Not sure about the exact version requirements, but earlier
    # versions (definitely 4.5.3 and earlier) don't work with newer
    # py-setuptools (version 68 and later) because of a breaking
    # change: error in beautifulsoup4 setup command: use_2to3 is invalid
    py-beautifulsoup4:
      require:
      - '@4.12.3:'
    # py-cartopy@:0.22 requires py-numpy@:1; @0.24.0 caps python@:3.12; @0.24.1: allows python@3.10:3.14
    py-cartopy:
      require:
      - '@0.24.1:'
      - +plotting
    # See py-pycparser
    py-click:
      require:
      - '@8.1.8'
    # Pin py-colorama to avoid duplicate packages, hopefully can be removed soon
    py-colorama:
      require:
      - '@0.4.6'
    # Pin to version 42 to avoid maturin dependency that breaks Intel oneAPI builds
    py-cryptography:
      require:
      - '@46'
    py-cython:
      require:
      - '@3.2.4'
    py-h5py:
      require:
      - '@3.16'
      - ~mpi
    # py-ipykernel@5.x requires python@3.6:3.9; @6.11: has no upper cap
    py-ipykernel:
      require:
      - '@6.11:'
    # Needed to fix issues of older versions (e.g. 1.13.0) with newer Python and
    # newer python packages: "ValueError: Unknown classifier in field project.classifiers ..."
    py-hatchling:
      require:
      - '@1.27:'
    # To avoid duplicate packages
    py-lxml:
      require:
      - '@6.0.2'
    # https://github.com/JCSDA/spack-stack/issues/1276
    py-matplotlib:
      require:
      - '@3.10.8'
      #- '@3.7.4'
      #- '@3.8.0'
    # https://github.com/JCSDA/spack-stack/issues/1971
    # py-netcdf4@:1.6 requires py-numpy@:1; @1.7: allows numpy@2
    py-netcdf4:
      require:
      - ~mpi
      - '@1.7:'
    # py-pandas@:2.2.1 requires py-numpy@:1; @:2.2.2 requires python@:3.12
    # ~performance disables optional py-bottleneck and py-numexpr dependencies
    # (py-numexpr fails to build with oneapi icpx; py-bottleneck pulls in py-maturin/rust)
    # Sites with rust/icpx available can override with +performance in their site packages.yaml
    py-pandas:
      require:
      - '@3:'
      prefer:
      - '~performance'
    # 0.11.1 replaces the Versioneer-based build that breaks with Python 3.12+.
    py-pandas-datareader:
      require:
      - '@0.11.1'
    # To avoid duplicate packages
    py-numpy:
      require:
      - '@2.1:'
    # To avoid duplicate packages
    py-poetry-core:
      require:
      - '@2.3.2'
    # See py-pycparser
    py-pooch:
      require:
      - '@1.7.0'
    py-pytest:
      require:
      - '@9:'
    # Need older version of py-pycparser until we can update setuputils to >= 77 ?
    # https://github.com/pydata/xarray/issues/10588
    py-pycparser:
      require:
      - '@3.0'
    # Need at least py-pygithub@2.7 for self-hosted runner management
    py-pygithub:
      require:
      - '@2.7:'
    # See py-pycparser
    py-imageio:
      require:
      - '@2.37.0'
    # This version builds with Intel oneAPI compilers, newer versions don't
    py-pyogrio:
      require:
      - '@0.9.0'
    # See py-pycparser
    py-pyparsing:
      require:
      - '@3.3.2'
    # To avoid duplicate packages
    py-python-dateutil:
      require:
      - '@2'
    # To avoid duplicate packages
    py-requests:
      require:
      - '@2.32.3'
    # To avoid duplicate packages
    py-ruamel-yaml:
      require:
      - '@0.18:'
    # py-ruamel-yaml-clib@:0.2.8 requires python@:3.12; @0.2.12: allows 3.13
    py-ruamel-yaml-clib:
      require:
      - '@0.2.12:'
    # https://github.com/JCSDA/spack-stack/issues/1942
    # https://github.com/spack/spack-packages/issues/3695
    py-setuptools:
      require:
      - '@80:'
    # py-sphinx@:6.1 requires python@:3.12; @6.2: allows 3.13
    py-sphinx:
      require:
      - '@6.2:'
    # See py-pycparser
    py-sphinxcontrib-bibtex:
      require:
      - '@2.5.0'
    py-torch:
      require:
      - '@2.10:'
      - +custom-protobuf
      - ~mkldnn
      # PyTorch 2.12 does not honor the recipe's USE_XPU=OFF setting when
      # built through PEP 517. With oneAPI, Kineto then enables its XPU/PTI
      # plugin, but the installed oneAPI toolkit does not provide PTI CMake
      # configuration files. Re-enable once that forwarding issue is fixed.
      - ~kineto
    # To avoid duplicate packages
    py-urllib3:
      require:
      - '@2.6.3'
    # py-xarray@:2024.5 requires py-numpy@:1; @2024.7 caps py-pandas@2.1; @2025.7: allows numpy@2 + pandas@2.2: (pandas@3: ok)
    py-xarray:
      require:
      - '@2025.7:'
    # On a per-site basis, either set qt to buildable: false
    # or add requirement to build with gcc for Intel oneAPI
    qt:
      require:
      - '@5'
    scotch:
      require:
      - '@7.0.10'
      - +mpi
      - +metis
      - ~shared
      - ~threads
      - ~mpi_thread
      - +noarch
      - +esmumps
      - +fortran
      - determinism=FIXED_SEED
    sfcio:
      require:
      - '@1.4.2'
    shumlib:
      require:
      - '@macos_clang_linux_intel_port'
    sigio:
      require:
      - '@2.3.3'
    # To avoid duplicate packages
    snappy:
      require:
      - +shared
    udunits:
      require:
      - '@2.2.28'
    ufs-utils:
      require:
      - '@1.13.0'
    # Note - we can remove upp from stack at some point?
    upp:
      require:
      - '@10.0.10'
    uwtools:
      require:
      - '@2.17.0'
    w3emc:
      require:
      - '@2.13.0'
      - precision=4,d,8
      - +build_deprecated
    w3nco:
      require:
      - '@2.4.1'
    # See macOS site config for wgrib2 version/variant overrides
    wgrib2:
      require:
      - '@3.8.0'
      - +ipolates
      - +netcdf
    wrf-io:
      require:
      - '@1.3.0'
    zstd:
      require:
      - '@1.5.7'
      - +programs
