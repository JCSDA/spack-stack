# Template for JEDI Skylab development
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  - ewok-env +ecflow ~cylc
  #- ai-env
  - geos-gcm-env          ^esmf@=8.6.1
  - jedi-fv3-env
  - jedi-geos-env         ^esmf@=8.6.1
  - jedi-mpas-env
  - jedi-neptune-env      ^esmf@=8.9.0
  - jedi-tools-env
  - jedi-ufs-env          ^esmf@=8.8.0
  #- jedi-um-env
  - neptune-env           ^esmf@=8.9.0
  - neptune-python-env    ^esmf@=8.9.0
  - soca-env

  # Various crtm tags (list all to avoid duplicate packages)
  - crtm@v2.4.1-jedi.2
  - crtm@3.1.2

  # Mapl with various esmf tags
  - mapl@2.53.0 ^esmf@8.6.1
  - mapl@2.53.4 ^esmf@8.8.0

  # Various esmf tags (list all to avoid duplicate packages)
  - esmf@=8.6.1
  - esmf@=8.8.0
  - esmf@=8.9.0

  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
    # Avoid duplicate builds of parallelio +pnetcdf and ~pnetcdf
    parallelio:
      require:
      - +pnetcdf
