# Template for JEDI Skylab development
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  - dev-utils-env
  - ewok-env
  - geos-gcm-env          ^esmf@=9.0.0b18
  - jedi-fv3-env
  - jedi-geos-env         ^esmf@=9.0.0b18
  - jedi-mpas-env
  - jedi-neptune-env      ^esmf@=9.0.0b18
  - jedi-python-env
  - jedi-tools-env
  - jedi-ufs-env          ^esmf@=9.0.0b17
  - neptune-env           ^esmf@=9.0.0b18
  - neptune-python-env    ^esmf@=9.0.0b18
  - soca-env

  - crtm@3.1.5

  # Mapl with various esmf tags
  - mapl@2.69.1 ^esmf@=9.0.0b17

  # Various esmf tags (list all to avoid duplicate packages)
  - esmf@=9.0.0b17
  - esmf@=9.0.0b18

  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
    # Avoid duplicate builds of parallelio +pnetcdf and ~pnetcdf
    parallelio:
      require:
      - +pnetcdf
