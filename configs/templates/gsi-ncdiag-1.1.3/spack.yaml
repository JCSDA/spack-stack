# For JCSDA/spack-stack issue #1938
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  - gsi-env ^crtm@3.1.2 # match unified-dev template

  repos: [$env/envrepo]

  packages:
    all:
      buildable: false
    gsi-ncdiag::
      require: ['@1.1.3']
      buildable: true
    gsi-env:
      buildable: true
