# Template for NEPTUNE development
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  - neptune-env ~debug +espc ^esmf@=8.9.0
  - neptune-env +debug +espc ^esmf@=8.9.0
  - neptune-python-env ^neptune-env ~debug +espc ^esmf@=8.9.0
  - jedi-neptune-env   ^neptune-env ~debug +espc ^esmf@=8.9.0
  - crtm@3.1.2
  - crtm@v2.4.1-jedi.2

  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
    # Avoid duplicate builds of parallelio +pnetcdf and ~pnetcdf
    parallelio:
      require:
      - ~pnetcdf
