spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  - neptune-env ~debug +espc ^esmf@=8.9.0
  - neptune-env +debug +espc ^esmf@=8.9.0
  - neptune-python-env +xnrl ^neptune-env ~debug +espc ^esmf@=8.9.0
  - jedi-neptune-env ^neptune-env ~debug +espc ^esmf@=8.9.0
  - crtm@3.1.2
  - crtm@v2.4.1-jedi.2

  packages:
    # Avoid duplicate builds of parallelio +pnetcdf and ~pnetcdf
    parallelio:
      require:
      - ~pnetcdf
