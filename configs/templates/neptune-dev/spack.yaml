# Template for NEPTUNE development
#
spack:
  concretizer:
    unify: when_possible

  view:
    release-openmp:
      root: views/release-openmp
      exclude:
      - neptune-env +debug +openmp
      - neptune-env ~debug ~openmp
      - neptune-env +debug ~openmp
      - esmf +debug +openmp
      - esmf ~debug ~openmp
      - esmf +debug ~openmp
      - ip ~openmp
      link: all
      link_type: symlink

  include: []

  specs:
  - dev-utils-env
  - neptune-env ~debug +openmp +espc +ncview ^esmf@=9.0.0b18
  - neptune-env +debug +openmp +espc +ncview ^esmf@=9.0.0b18
  - neptune-env ~debug ~openmp +espc +ncview ^esmf@=9.0.0b18
  - neptune-env +debug ~openmp +espc +ncview ^esmf@=9.0.0b18
  - neptune-python-env +gittools +lis-ncoda-utils ^neptune-env ~debug +openmp +espc +ncview ^esmf@=9.0.0b18
  - jedi-neptune-env +adp +sdp +jedi              ^neptune-env ~debug +openmp +espc +ncview ^esmf@=9.0.0b18
  - crtm@3.1.3

  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
