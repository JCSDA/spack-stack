# Template for GEOS development
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  # Two builds: release (esmf ~debug) and debug (esmf +debug).
  # The esmf debug variant is driven solely by the geos-gcm-env debug variant
  # (see geos_gcm_env/package.py). On platforms where only +debug is supported
  # (e.g., macOS), the site packages.yaml requires geos-gcm-env +debug, which
  # causes both specs to resolve to +debug (only one unique build).
  #
  # Also, NAG cannot build FMS yet (due to use of cray pointers)
  - geos-gcm-env ~debug ~fms ~cdo
  - geos-gcm-env +debug ~fms ~cdo


  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
      - '@=9.0.0b11'
