# Template for GEOS development
#
spack:
  concretizer:
    unify: when_possible

  view: false
  include: []

  specs:
  # NOTE: The first spec explicitly requests ~debug to ensure both a release and
  # a debug ESMF build are concretized. On platforms where only +debug is supported
  # (e.g., macOS with gcc-15/gfortranclang or NAG), the site's packages.yaml enforces
  # require: ['+debug'], which overrides ~debug here and unifies both specs onto +debug.
  - geos-gcm-env ^esmf@=9.0.0b11~debug
  - geos-gcm-env +debug ^esmf@=9.0.0b11+debug


  packages:
    # Turn on python variant for esmf
    esmf:
      require:
      - +python
